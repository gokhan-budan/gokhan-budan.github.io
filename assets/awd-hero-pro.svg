low)"><path d="M532 319 L532 355 L250 355"/><path d="M532 355 L785 355"/></g><g fill="#ffad55" stroke="#ffe1b5" stroke-width="3"><circle cx="250" cy="355" r="15"/><circle cx="785" cy="355" r="15"/></g><g fill="none" stroke="#6ed1ff" stroke-width="3"><path d="M250 370 L250 405 L140 405"/><path d="M785 370 L785 405 L920 405"/><path d="M530 270 L530 218 L680 218"/></g><g font-family="Arial" fill="#d7eaf2"><text x="70" y="435" font-size="20">Front e-axle</text><text x="825" y="435" font-size="20">Rear drive unit</text><text x="688" y="211" font-size="20">Torque arbitration</text></g></g><g transform="translate(1120 125)"><rect width="410" height="490" rx="14" fill="#08131f" stroke="#45687c" stroke-width="2"/><text x="28" y="42" fill="#e5f2f8" font-family="Arial" font-size="23" font-weight="600">CONTROL &amp; DIAGNOSTICS</text><g font-family="Arial" font-size="17" fill="#9eb9c8"><text x="28" y="94">Driver demand</text><text x="28" y="161">Vehicle state</text><text x="28" y="228">Torque allocation</text><text x="28" y="295">Actuator feedback</text><text x="28" y="362">Fault management</text></g><g stroke="#6bc9f4" stroke-width="2" fill="#10293a"><rect x="28" y="107" width="350" height="34" rx="5"/><rect x="28" y="174" width="350" height="34" rx="5"/><rect x="28" y="241" width="350" height="34" rx="5"/><rect x="28" y="308" width="350" height="34" rx="5"/><rect x="28" y="375" width="350" height="34" rx="5"/></g><g fill="#d6edf8" font-family="Arial" font-size="14"><text x="42" y="129">Mode / request arbitration</text><text x="42" y="196">Wheel speed · slip · yaw · load</text><text x="42" y="263">Front / rear torque targets</text><text x="42" y="330">Limits · tracking · plausibility</text><text x="42" y="397">Degraded modes · recovery</text></g><g stroke="#ffab55" stroke-width="3" fill="none"><path d="M203 141 V174 M203 208 V241 M203 275 V308 M203 342 V375"/></g><text x="28" y="453" fill="#ffbf79" font-family="Arial" font-size="15">Deterministic • Observable • Fault-aware</te